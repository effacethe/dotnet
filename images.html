<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Efface — Images</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #222222;
      color: #777777;
      font-family: monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      padding: 2rem;
    }

    .gallery {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
      width: 100%;
    }

    .gallery img {
      max-width: calc(100vw - 8rem);
      max-height: calc(100vh - 10rem);
      object-fit: contain;
      display: block;
    }

    .arrow {
      font-size: 1.2rem;
      color: #777777;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.5rem;
      user-select: none;
      flex-shrink: 0;
    }

    .arrow:hover { text-decoration: underline; color: #444444; }
    .arrow:disabled { opacity: 0.2; cursor: default; text-decoration: none; }

    .counter {
      font-size: 0.75rem;
      color: #555;
    }

    .home-link {
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      color: inherit;
      text-decoration: none;
      margin-top: 1rem;
    }

    .home-link:hover { text-decoration: underline; color: #444444; }

    .no-images {
      font-size: 0.85rem;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="gallery">
    <button class="arrow" id="prev" onclick="change(-1)">&#60;</button>
    <img id="photo" src="" alt="" />
    <button class="arrow" id="next" onclick="change(1)">&#62;</button>
  </div>

  <span class="counter" id="counter"></span>
  <a class="home-link" href="index.html">EFFACE</a>

  <script>
    // This list builds itself from whatever is in the /images folder.
    // Images appear in filename order (photo01, photo02, ...).
    const images = [
{% assign files = site.static_files | sort: "path" %}
{% for f in files %}
  {% if f.path contains "/images/" %}
    {% assign ext = f.extname | downcase %}
    {% if ext == ".png" or ext == ".jpg" or ext == ".jpeg" or ext == ".gif" or ext == ".webp" %}
      "{{ f.path | remove_first: '/' }}",
    {% endif %}
  {% endif %}
{% endfor %}
    ];

    let current = 0;

    const photo   = document.getElementById('photo');
    const counter = document.getElementById('counter');
    const prev    = document.getElementById('prev');
    const next    = document.getElementById('next');

    function show(i) {
      photo.src = images[i];
      photo.alt = 'Image ' + (i + 1);
      counter.textContent = (i + 1) + ' / ' + images.length;
      prev.disabled = i === 0;
      next.disabled = i === images.length - 1;
    }

    function change(dir) {
      current = Math.max(0, Math.min(images.length - 1, current + dir));
      show(current);
    }

    if (images.length === 0) {
      document.querySelector('.gallery').innerHTML = '<span class="no-images">no images yet</span>';
      counter.style.display = 'none';
    } else {
      show(0);
    }

    document.addEventListener('keydown', function(e) {
      if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') change(1);
      if (e.key === 'ArrowLeft'  || e.key === 'a' || e.key === 'A') change(-1);
    });
  </script>

</body>
</html>
